<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KLSWA Strike Suggestion Box</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="public-form-shell">
      <section class="public-form-intro">
        <p class="eyebrow">AKSPBS / KLSWA</p>
        <h1>Strike Suggestion Box</h1>
        <p>Members can submit suggestions regarding strike planning and association action.</p>
      </section>

      <section class="box public-form-card">
        <form id="strikeSuggestionForm" class="form-grid">
          <div class="three">
            <label>Name *
              <input name="name" placeholder="Member name" required>
            </label>
            <label>Batch Year *
              <select name="batchYear" id="batchYear" required>
                <option value="">Select batch</option>
              </select>
            </label>
            <label>District *
              <select name="district" id="district" required>
                <option value="">Select district</option>
              </select>
            </label>
          </div>
          <label>Suggestion *
            <textarea name="suggestion" rows="6" placeholder="Write your suggestion regarding strike..." required></textarea>
          </label>
          <div class="message" id="suggestionMessage"></div>
          <div class="actions">
            <button class="primary" type="submit">Submit suggestion</button>
            <button class="secondary" type="reset">Clear</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/strike-suggestion.js"></script>
  </body>
</html>
